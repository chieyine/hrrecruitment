name: quality-gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: frad_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d frad_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/frad_ci
      APP_URL: http://127.0.0.1:3000
      JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
      SESSION_SECRET: ci-only-session-secret-at-least-thirty-two-characters
      STORAGE_ENCRYPTION_KEY: ci-only-storage-key-at-least-thirty-two-characters
      OUTBOX_ENCRYPTION_KEY: ci-only-outbox-key-at-least-thirty-two-characters
      CRON_SECRET: ci-only-cron-secret-at-least-thirty-two-characters
      HEALTH_SECRET: ci-only-health-secret-at-least-thirty-two-chars
      SEED_PASSWORD: CI-Only-Strong-Password-123!
      # The E2E harness and helpers both read E2E_TEST_PASSWORD. The previous
      # E2E_CANDIDATE_PASSWORD / E2E_HR_PASSWORD names were read by nothing.
      E2E_TEST_PASSWORD: CI-Only-Strong-Password-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # `npm ci` installs exactly what package-lock.json pins; `npm install`
      # could silently resolve different versions than the ones reviewed.
      - run: npm ci
      - run: npx prisma db push --accept-data-loss
      - run: npm run db:seed
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run audit:frontend-coverage
      # Guards the generated PostgreSQL schema: it drifted out of sync once and
      # nothing in CI noticed until the Docker build failed.
      - run: npm run db:postgres:schema
      - name: Fail if the generated PostgreSQL schema is out of date
        run: git diff --exit-code -- prisma/postgresql/schema.prisma
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 14 }
